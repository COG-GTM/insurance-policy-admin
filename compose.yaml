services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pas
      POSTGRES_USER: pas
      POSTGRES_PASSWORD: ${PAS_DB_PASSWORD:-pas}
    ports:
      - "${PAS_DB_PORT:-5432}:5432"
    volumes:
      - pas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pas -d pas"]
      interval: 5s
      timeout: 3s
      retries: 10

  policy-service:
    image: pas-policy-service:local
    build:
      context: ./pas
      dockerfile: pas-policy-service/Dockerfile
    environment:
      PAS_DB_URL: jdbc:postgresql://postgres:5432/pas
      PAS_DB_USERNAME: pas
      PAS_DB_PASSWORD: ${PAS_DB_PASSWORD:-pas}
    ports:
      - "${PAS_HTTP_PORT:-8080}:8080"
      - "${PAS_MANAGEMENT_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 4s
      start_period: 30s
      retries: 6

# Add a broker service here once ADR-0001 (AB-518) selects one.
volumes:
  pas-postgres-data:
