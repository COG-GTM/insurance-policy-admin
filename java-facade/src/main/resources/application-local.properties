# PAS REST Facade - Local Development Profile
# Uses H2 in-memory database instead of DB2 on z/OS.
# Activate with: --spring.profiles.active=local

server.port=8080

# Local API client (H2 seed data). Pick your own key and export its digest:
#   export PAS_LOCAL_API_KEY_SHA256=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)
# Unset means no client is configured and every /api/** request returns 401.
pas.security.clients[0].id=${PAS_LOCAL_API_CLIENT_ID:local-dev}
pas.security.clients[0].key-sha256=${PAS_LOCAL_API_KEY_SHA256:}
pas.security.clients[0].branches=${PAS_LOCAL_API_CLIENT_BRANCHES:*}
server.context-path=/

# H2 in-memory database (replaces DB2 z/OS connection)
spring.datasource.url=jdbc:h2:mem:pasdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

# Enable H2 web console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoints
management.security.enabled=false
management.context-path=/manage
endpoints.health.sensitive=false

# Logging
logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
logging.level.org.springframework.jdbc=DEBUG
