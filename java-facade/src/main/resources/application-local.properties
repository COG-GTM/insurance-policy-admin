# PAS REST Facade - Local Development Profile
# Uses H2 in-memory database instead of DB2 on z/OS.
# Activate with: --spring.profiles.active=local
#
# This profile is for a developer workstation only. It must never be
# activated in a shared, staging or production environment.

server.port=8080
server.context-path=/
# Bind to loopback only: nothing in this profile is safe to expose on a network.
server.address=${LOCAL_BIND_ADDRESS:127.0.0.1}

# H2 in-memory database (replaces DB2 z/OS connection)
spring.datasource.url=jdbc:h2:mem:pasdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=${H2_PASSWORD:local-dev-password}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

# H2 web console: opt-in only (H2 allows arbitrary SQL and CREATE ALIAS/TRIGGER,
# i.e. code execution, on whatever it can reach). Start with
# -DH2_CONSOLE_ENABLED=true when you actually need it.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false

# Actuator endpoints
management.security.enabled=false
management.context-path=/manage
endpoints.health.sensitive=false

# Logging
logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
logging.level.org.springframework.jdbc=DEBUG
