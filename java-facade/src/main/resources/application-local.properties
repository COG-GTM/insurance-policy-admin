# PAS REST Facade - Local Development Profile
# Uses H2 in-memory database instead of DB2 on z/OS.
# Activate with: --spring.profiles.active=local

server.port=8080
server.context-path=/

# H2 in-memory database (replaces DB2 z/OS connection)
spring.datasource.url=jdbc:h2:mem:pasdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

# Enable H2 web console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoints (secured; only /manage/health is anonymous)
management.security.enabled=true
management.context-path=/manage
endpoints.health.sensitive=false

# Local-only API clients. Passwords are BCrypt hashes of "local-dev-password";
# these credentials exist for the H2 profile only and are not valid anywhere else.
pas.security.clients[0].username=local-admin
pas.security.clients[0].password-hash=$2a$10$HJ5HlP5UqIbfrH7JsD9Yr.J9Aqukh6EXwtQzuCszAaBpOuLl75U5.
pas.security.clients[0].unrestricted=true
pas.security.clients[1].username=local-agent
pas.security.clients[1].password-hash=$2a$10$HJ5HlP5UqIbfrH7JsD9Yr.J9Aqukh6EXwtQzuCszAaBpOuLl75U5.
pas.security.clients[1].agent-codes=AG1001

# Logging
logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
logging.level.org.springframework.jdbc=DEBUG
