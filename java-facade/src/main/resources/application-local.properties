# PAS REST Facade - Local Development Profile
# Uses H2 in-memory database instead of DB2 on z/OS.
# Activate with: --spring.profiles.active=local

server.port=8080
server.context-path=/

# H2 in-memory database (replaces DB2 z/OS connection)
spring.datasource.url=jdbc:h2:mem:pasdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

# Enable H2 web console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator endpoints
# Only health (status only, no details) and info are exposed. All other
# actuator endpoints (env, heapdump, dump, trace, configprops, mappings,
# loggers, ...) are disabled: they leak credentials and runtime internals.
management.security.enabled=true
management.context-path=/manage
endpoints.enabled=false
endpoints.health.enabled=true
endpoints.health.sensitive=false
endpoints.info.enabled=true

# Logging
logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
logging.level.org.springframework.jdbc=DEBUG
