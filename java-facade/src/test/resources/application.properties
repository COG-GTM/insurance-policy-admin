# Test configuration - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=DB2
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

# Only the health endpoint is exposed; all other actuator endpoints
# (env, heapdump, trace, dump, beans, configprops, ...) are disabled.
management.context-path=/manage
endpoints.enabled=false
endpoints.health.enabled=true
endpoints.health.sensitive=false

logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
