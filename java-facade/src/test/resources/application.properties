# Test configuration - H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=DB2
# Schema/seed scripts run as the H2 admin; the application connects as the
# least-privilege PASFACAD account created in schema.sql.
spring.datasource.schema-username=sa
spring.datasource.schema-password=${H2_ADMIN_PASSWORD:local-h2-admin}
spring.datasource.data-username=sa
spring.datasource.data-password=${H2_ADMIN_PASSWORD:local-h2-admin}
spring.datasource.username=PASFACAD
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.initialize=true

management.security.enabled=false
management.context-path=/manage
endpoints.health.sensitive=false

logging.level.root=WARN
logging.level.com.acme.insurance.pas=DEBUG
