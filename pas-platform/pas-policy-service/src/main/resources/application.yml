spring:
  application:
    name: pas-policy-service
  datasource:
    url: ${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
    username: ${PAS_DB_USERNAME}
    password: ${PAS_DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          claims-api:
            provider: claims-api
            client-id: ${PAS_CLAIMS_CLIENT_ID:local}
            client-secret: ${PAS_CLAIMS_CLIENT_SECRET:local}
            authorization-grant-type: client_credentials
            scope: claims:history:read
        provider:
          claims-api:
            token-uri: ${PAS_CLAIMS_TOKEN_URL:http://localhost:8090/oauth/token}
  kafka:
    bootstrap-servers: ${PAS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
      acks: all
    consumer:
      enable-auto-commit: false
    listener:
      ack-mode: record
  flyway:
    schemas: pas
    default-schema: pas
    locations: classpath:db/migration
  main:
    banner-mode: "off"

pas:
  kafka:
    topics:
      enabled: ${PAS_KAFKA_TOPICS_ENABLED:true}
      partitions: ${PAS_KAFKA_TOPIC_PARTITIONS:1}
      replicas: ${PAS_KAFKA_TOPIC_REPLICAS:1}
  rating:
    factor-mode: ${PAS_RATING_FACTOR_MODE:legacy}
  routing:
    policy-inquiry: ${PAS_ROUTE_POLICY_INQUIRY:legacy}
    new-business: ${PAS_ROUTE_NEW_BUSINESS:legacy}
    underwriting: ${PAS_ROUTE_UNDERWRITING:legacy}
    renewal: ${PAS_ROUTE_RENEWAL:legacy}
    endorsement: ${PAS_ROUTE_ENDORSEMENT:legacy}
    document-events: ${PAS_ROUTE_DOCUMENT_EVENTS:legacy}
    broker-portal-read: ${PAS_ROUTE_BROKER_PORTAL_READ:legacy}
  bridge:
    document-queue: ${PAS_BRIDGE_DOCUMENT_QUEUE:ACME.PAS.DOCUMENT.REQUEST}
    decision-queue: ${PAS_BRIDGE_DECISION_QUEUE:ACME.PAS.UNDERWRITING.DECISION}
    referral-queue: ${PAS_BRIDGE_REFERRAL_QUEUE:ACME.PAS.UNDERWRITING.REQUEST}
    referral-triggers: ${PAS_BRIDGE_REFERRAL_TRIGGERS:NEW_BUSINESS}
    charset: ${PAS_BRIDGE_CHARSET:IBM037}
    mq:
      host: ${PAS_BRIDGE_MQ_HOST:}
      port: ${PAS_BRIDGE_MQ_PORT:1414}
      queue-manager: ${PAS_BRIDGE_MQ_QUEUE_MANAGER:}
      channel: ${PAS_BRIDGE_MQ_CHANNEL:}
      tls-cipher-suite: ${PAS_BRIDGE_MQ_TLS_CIPHER_SUITE:}
  outbox:
    relay:
      enabled: ${PAS_OUTBOX_RELAY_ENABLED:true}
      poll-interval: ${PAS_OUTBOX_RELAY_POLL_INTERVAL:PT1S}
      batch-size: ${PAS_OUTBOX_RELAY_BATCH_SIZE:50}
      ack-timeout: ${PAS_OUTBOX_RELAY_ACK_TIMEOUT:PT10S}
  new-business:
    default-coverages:
      AUT:
        - type: AUTL
          description: Auto Liability
        - type: AUTP
          description: Auto Physical Damage
      HOM:
        - type: PROP
          description: Dwelling Coverage
        - type: LIAB
          description: Personal Liability
      COM:
        - type: PROP
          description: Commercial Property
        - type: LIAB
          description: General Liability
        - type: WKCP
          description: Workers Compensation
  underwriting:
    senior-referral: 300
    manager-referral: 600
    auto-decline: 800
    credit-ceiling: 900
    no-score-base: 400
    substandard-adjustment: 200
    preferred-adjustment: -100
    first-claim-threshold: 3
    first-claim-adjustment: 150
    second-claim-threshold: 5
    second-claim-adjustment: 200
    loss-ratio-threshold: 80
    loss-ratio-adjustment: 200
    first-limit-threshold: 5000000
    first-limit-adjustment: 100
    second-limit-threshold: 10000000
    second-limit-adjustment: 200
    accumulation-threshold: 500000000
    accumulation-adjustment: 300
  claims:
    adapter: ${PAS_CLAIMS_ADAPTER:rest}
    rest:
      base-url: ${PAS_CLAIMS_REST_BASE_URL:}
      connect-timeout: ${PAS_CLAIMS_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${PAS_CLAIMS_READ_TIMEOUT:PT5S}
      max-attempts: ${PAS_CLAIMS_MAX_ATTEMPTS:3}
      retry-backoff: ${PAS_CLAIMS_RETRY_BACKOFF:PT0.2S}
    fixture:
      policies: {}
  clock:
    zone: ${PAS_CLOCK_ZONE:UTC}
  renewal:
    uplift-pct: 5.00
    max-increase-pct: 15.00
    max-open-claims: 3
    window-days-before-expiry: 90
    window-days-after-expiry: 30
  pii:
    encryption:
      active-key-id: ${PAS_PII_ENCRYPTION_KEY_ID:local-v1}
      active-key-version: ${PAS_PII_ENCRYPTION_KEY_VERSION:1}
      active-key: ${PAS_PII_ENCRYPTION_KEY:}
    blind-index:
      key: ${PAS_PII_BLIND_INDEX_KEY:}

springdoc:
  swagger-ui:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    json:
      customizer:
        - com.acme.insurance.pas.pii.logging.PiiMaskingJsonCustomizer
