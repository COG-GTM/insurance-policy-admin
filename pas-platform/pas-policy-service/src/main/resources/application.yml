spring:
  application:
    name: pas-policy-service
  datasource:
    url: ${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
    username: ${PAS_DB_USERNAME}
    password: ${PAS_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${PAS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    schemas: pas
    default-schema: pas
    locations: classpath:db/migration
  main:
    banner-mode: "off"

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
