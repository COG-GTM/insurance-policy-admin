openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers: []
paths:
  /api/v1/policies:
    get:
      tags:
      - policy-inquiry-controller
      summary: Search policies for the broker portal
      description: Requires policy:read and applies caller entitlements before filtering.
      operationId: search
      parameters:
      - name: agentCode
        in: query
        required: false
        schema:
          type: string
      - name: branchCode
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: policyType
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
    post:
      tags:
      - new-business-controller
      summary: Create a new-business policy
      description: Requires policy:write and entitlement to the requested agent or
        branch. Shadow mode records only PII-free validation results.
      operationId: create
      parameters:
      - name: X-Correlation-Id
        in: header
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBusinessRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/underwriting-decisions:
    get:
      tags:
      - underwriting-controller
      summary: List underwriting decisions for a policy
      operationId: list
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
    post:
      tags:
      - underwriting-controller
      summary: Run underwriting for a policy
      operationId: decide
      parameters:
      - name: X-Correlation-Id
        in: header
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/underwriting-decisions/{decisionId}/override:
    post:
      tags:
      - underwriting-controller
      summary: Override the latest underwriting decision
      operationId: override
      parameters:
      - name: X-Correlation-Id
        in: header
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      - name: decisionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/renewals:
    post:
      tags:
      - renewal-controller
      summary: Renew a policy for the next term (POLRNW)
      description: "Requires policy:renew and a matching book, agent_id, or branch_codes\
        \ entitlement. Idempotent per term: a second request for the same termExpiryDate\
        \ is 409."
      operationId: renew
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewalRequest"
        required: true
      responses:
        "201":
          description: Policy renewed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RenewalResponse"
        "202":
          description: "Route is in SHADOW: result recorded in pas_shadow, policy\
            \ unchanged"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RenewalResponse"
        "400":
          description: Malformed request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token lacks policy:renew
        "404":
          description: Policy is unknown or not entitled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Term already renewed or termExpiryDate is not the current term
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Renewal rejected by a business rule
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Renewal route is LEGACY or the claims source is unavailable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/endorsements:
    post:
      tags:
      - endorsement-controller
      summary: Endorse a policy mid-term (POLEND)
      description: "Requires policy:endorse and a matching book, agent_id, or branch_codes\
        \ entitlement. Concurrent endorsements on one policy are serialised by a row\
        \ lock."
      operationId: endorse
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndorsementRequest"
        required: true
      responses:
        "201":
          description: Endorsement recorded and applied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndorsementResponse"
        "202":
          description: "Route is in SHADOW: result recorded in pas_shadow, policy\
            \ unchanged"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EndorsementResponse"
        "400":
          description: Malformed request
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token lacks policy:endorse
        "404":
          description: Policy is unknown or not entitled
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "Endorsement rejected: type, term, date or details invalid"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Endorsement route is LEGACY
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/v1/admin/events/dlt-replay:
    post:
      tags:
      - dlt-replay-controller
      operationId: replay
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DltReplayRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/v1/policies/{policyNumber}:
    get:
      tags:
      - policy-inquiry-controller
      summary: Read a policy
      description: "Requires policy:read and a matching book, agent_id, or branch_codes\
        \ entitlement."
      operationId: policy
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Policy found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token lacks policy:read
        "404":
          description: Policy is unknown or not entitled
        "503":
          description: Policy inquiry route is not serving traffic
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/policyholder:
    get:
      tags:
      - policy-inquiry-controller
      summary: Read the policyholder screen view
      description: Requires policy:read and policy entitlement. pii:read reveals regulated
        fields; otherwise values are masked.
      operationId: policyholder
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Policyholder screen view
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyholderResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token lacks policy:read
        "404":
          description: Policy or policyholder is unknown or not entitled
        "503":
          description: Policy inquiry route is not serving traffic
      security:
      - bearerAuth: []
  /api/v1/policies/{policyNumber}/coverages:
    get:
      tags:
      - policy-inquiry-controller
      summary: Read all coverages for a policy
      description: "Requires policy:read and the policy's book, agent_id, or branch_codes\
        \ entitlement."
      operationId: coverages
      parameters:
      - name: policyNumber
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Policy coverages in sequence order
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoverageResponse"
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Token lacks policy:read
        "404":
          description: Policy is unknown or not entitled
        "503":
          description: Policy inquiry route is not serving traffic
      security:
      - bearerAuth: []
  /api/v1/platform/whoami:
    get:
      tags:
      - whoami-controller
      operationId: whoami
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WhoamiResponse"
components:
  schemas:
    NewBusinessRequest:
      type: object
      properties:
        policyType:
          type: string
        policyholderId:
          type: string
        effectiveDate:
          type: string
          format: date
        agentCode:
          type: string
        branchCode:
          type: string
        coverageLimit:
          type: number
        deductible:
          type: number
        totalPremium:
          type: number
    OverrideRequest:
      type: object
      properties:
        decisionCode:
          type: string
        reason:
          type: string
    RenewalRequest:
      type: object
      properties:
        termExpiryDate:
          type: string
          format: date
          description: Expiry date of the term being renewed. A second request for
            the same term is 409.
          example: 2025-01-01
      required:
      - termExpiryDate
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type:
          - string
          - "null"
        status:
          type: integer
          format: int32
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
    RenewalResponse:
      type: object
      properties:
        policyNumber:
          type: string
        mode:
          type: string
        priorEffectiveDate:
          type: string
          format: date
        priorExpiryDate:
          type: string
          format: date
        effectiveDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
        priorPremium:
          type: number
        totalPremium:
          type: number
        rateChangePct:
          type: number
        capped:
          type: boolean
        renewalCount:
          type: integer
          format: int32
        policyStatus:
          type: string
        uwStatus:
          type: string
        openClaims:
          type: integer
          format: int32
    AddressChange:
      type: object
      properties:
        addrLine1:
          type: string
          maxLength: 40
          minLength: 0
        addrLine2:
          type: string
          maxLength: 40
          minLength: 0
        city:
          type: string
          maxLength: 25
          minLength: 0
        stateCode:
          type: string
          maxLength: 2
          minLength: 2
        zipCode:
          type: string
          maxLength: 10
          minLength: 0
      required:
      - addrLine1
      - city
      - stateCode
      - zipCode
    CoverageAddition:
      type: object
      properties:
        coverageType:
          type: string
          maxLength: 4
          minLength: 0
        description:
          type: string
          maxLength: 40
          minLength: 0
        coverageLimit:
          type: number
          minimum: 0.00
        deductible:
          type: number
          minimum: 0.00
        premium:
          type: number
          minimum: 0.00
      required:
      - coverageType
    EndorsementRequest:
      type: object
      properties:
        type:
          type: string
          description: "CAD, CRM, LCH, ACH or CAN"
          example: LCH
        effectiveDate:
          type: string
          format: date
          description: Endorsement effective date; defaults to today
          example: 2024-07-01
        description:
          type: string
          maxLength: 100
          minLength: 0
        coverageSeq:
          type: integer
          format: int32
        newLimit:
          type: number
          minimum: 0.00
        coverage:
          $ref: "#/components/schemas/CoverageAddition"
        address:
          $ref: "#/components/schemas/AddressChange"
    EndorsementResponse:
      type: object
      properties:
        policyNumber:
          type: string
        mode:
          type: string
        endorsementSeq:
          type: integer
          format: int32
        type:
          type: string
        effectiveDate:
          type: string
          format: date
        description:
          type: string
        proRataFactor:
          type: number
        premiumAdjustment:
          type: number
        totalPremium:
          type: number
        policyStatus:
          type: string
    DltReplayRequest:
      type: object
      properties:
        dltTopic:
          type: string
        partition:
          type: integer
          format: int32
        fromOffset:
          type: integer
          format: int64
        toOffset:
          type: integer
          format: int64
        maxRecords:
          type: integer
          format: int32
    PolicyResponse:
      type: object
      properties:
        policyNumber:
          type: string
        policyType:
          type: string
        policyStatus:
          type: string
        effectiveDate:
          type: string
        expiryDate:
          type: string
        policyholderId:
          type: string
        agentCode:
          type: string
        branchCode:
          type: string
        totalPremium:
          type: number
        deductible:
          type: number
        coverageLimit:
          type: number
        inceptionDate:
          type: string
        renewalCount:
          type: integer
          format: int32
        uwStatus:
          type: string
        riskScore:
          type: integer
          format: int32
        webIndicator:
          type: string
        apiFlag:
          type: string
        lastUpdated:
          type: integer
          format: int64
        updatedBy:
          type: string
    PolicyholderResponse:
      type: object
      properties:
        policyNumber:
          type: string
        custId:
          type: string
        custType:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        middleInit:
          type: string
        companyName:
          type: string
        addrLine1:
          type: string
        addrLine2:
          type: string
        city:
          type: string
        stateCode:
          type: string
        zipCode:
          type: string
        countryCode:
          type: string
        phone:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
        birthYear:
          type: integer
          format: int32
        ssnLast4:
          type: string
        taxId:
          type: string
        creditScore:
          type: integer
          format: int32
        riskTier:
          type: string
        gdprConsent:
          type: string
        piiMasked:
          type: boolean
    CoverageResponse:
      type: object
      properties:
        policyNumber:
          type: string
        sequenceNum:
          type: integer
          format: int32
        coverageType:
          type: string
        description:
          type: string
        coverageLimit:
          type: number
        deductible:
          type: number
        premium:
          type: number
        effectiveDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
        coinsurancePct:
          type: integer
          format: int32
        ratingTerritory:
          type: string
        classCode:
          type: string
    WhoamiResponse:
      type: object
      properties:
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
