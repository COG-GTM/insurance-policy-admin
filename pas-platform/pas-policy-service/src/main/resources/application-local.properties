# Local development only (make dev / docker compose). Tokens come from a throwaway key pair
# generated by pas-platform/dev/dev-jwt.sh; only its public key is mounted, nothing is committed.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${PAS_OIDC_ISSUER_URI:https://pas-dev-issuer.local}
spring.security.oauth2.resourceserver.jwt.audiences=${PAS_OIDC_AUDIENCE:pas-api}
# Public half of the dev key pair; only this profile reads PAS_DEV_JWT_PUBLIC_KEY.
spring.security.oauth2.resourceserver.jwt.public-key-location=${PAS_DEV_JWT_PUBLIC_KEY:file:.dev-keys/jwt-dev-public.pem}
# No Claims-owned interface locally: in-memory claims stub (empty history).
pas.claims.adapter=${PAS_CLAIMS_ADAPTER:stub}
