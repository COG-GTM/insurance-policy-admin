spring.application.name=pas-policy-service
server.port=8080

# Datasource (same env vars across PAS platform services)
spring.datasource.url=${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
spring.datasource.username=${PAS_DB_USERNAME:pas}
spring.datasource.password=${PAS_DB_PASSWORD:}

# Flyway owns the pas schema
spring.flyway.enabled=true
spring.flyway.schemas=pas
spring.flyway.default-schema=pas
spring.flyway.create-schemas=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=pas

# PII field encryption (AB-521). Base64 256-bit keys from the environment/secret store.
# No defaults: startup fails if they are missing. See docs/modernization/pii-handling.md.
pas.pii.encryption-key=${PAS_PII_ENCRYPTION_KEY}
pas.pii.blind-index-key=${PAS_PII_BLIND_INDEX_KEY}
pas.pii.key-id=${PAS_PII_KEY_ID:k1}

# Rating factor set read from pas.territory_factors / pas.class_factors (AB-522). PARITY keeps
# PREMBAT output (factors 1.0000); FILED is the flag-guarded real-factor follow-up.
pas.rating.factor-set=${PAS_RATING_FACTOR_SET:PARITY}

# Kafka client config only; app must boot without a broker
spring.kafka.bootstrap-servers=${PAS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
# Outbox relay producer (AB-525): idempotent, all in-sync replicas, bounded blocking without a broker
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000

# Domain events (ADR 0001 D4) via the transactional outbox pas.outbox (AB-525)
pas.events.policy-topic=${PAS_POLICY_EVENTS_TOPIC:pas.policy.events.v1}
pas.events.underwriting-topic=${PAS_UNDERWRITING_EVENTS_TOPIC:pas.underwriting.events.v1}
pas.outbox.relay.enabled=${PAS_OUTBOX_RELAY_ENABLED:true}
pas.outbox.relay.poll-interval=${PAS_OUTBOX_RELAY_POLL_INTERVAL:PT1S}
pas.outbox.relay.batch-size=100
pas.outbox.relay.send-timeout=PT15S

# Claims history adapter (AB-525): 'unavailable' refuses underwriting until the Claims-owned
# interface exists (Pending: Claims team); 'stub' is an empty in-memory adapter for local/test use.
pas.claims.adapter=${PAS_CLAIMS_ADAPTER:unavailable}

# Renewal (AB-526). uplift = POLRNW's 1.05 (quirk register Q-05); flat 15% cap (Q-04), per-state
# overrides go in pas.renewal.state-rate-cap-pct.<STATE> once a RenewalRateCapPolicy uses them;
# more than max-open-claims open claims makes a policy ineligible (Q-02 fix).
pas.renewal.uplift-pct=${PAS_RENEWAL_UPLIFT_PCT:5}
pas.renewal.rate-cap-pct=${PAS_RENEWAL_RATE_CAP_PCT:15}
pas.renewal.max-open-claims=${PAS_RENEWAL_MAX_OPEN_CLAIMS:3}

# Business date for POLNEW/UNDWRT "today" (CICS FORMATTIME). Mainframe region zone to be confirmed.
pas.business-time-zone=${PAS_BUSINESS_TIME_ZONE:America/New_York}

# Actuator: minimal exposure, k8s probes, prometheus scrape
# Only health (probes) and prometheus exist; every other actuator endpoint is disabled.
# Health probes are the only unauthenticated paths (SecurityConfig); prometheus needs a JWT.
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never


# OAuth2 resource server (ADR 0001 D5). Both are required; there is no default issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${PAS_OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${PAS_OIDC_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=RS256

# OpenAPI: committed spec is src/main/resources/openapi/pas-policy-v1.yaml (drift-tested).
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
