spring.application.name=pas-batch
server.port=8081

# Datasource (same env vars across PAS platform services)
spring.datasource.url=${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
spring.datasource.username=${PAS_DB_USERNAME:pas}
spring.datasource.password=${PAS_DB_PASSWORD:}

# Flyway owns Spring Batch metadata in its own schema
spring.flyway.enabled=true
spring.flyway.schemas=pas_batch
spring.flyway.default-schema=pas_batch
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration/batch

# Rating factor set for pas-rating (AB-522): PARITY reproduces PREMBAT (factors 1.0000).
# FILED = real territory/class factors; off by default, business decision (OQ-04).
pas.rating.factor-set=${PAS_RATING_FACTOR_SET:PARITY}

# Jobs are launched explicitly, not on startup; metadata schema comes from Flyway
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=pas_batch.BATCH_

# Actuator: minimal exposure, k8s probes, prometheus scrape
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# AB-527 extracts (DAILY-EXTRACT / MONTHLY-EXPOSURE). See docs/modernization/extracts-runbook.md.
pas.extract.output-dir=${PAS_EXTRACT_OUTPUT_DIR:/var/lib/pas-batch/extracts}

# SFTP only (key auth + known_hosts). Values come from the secrets store via env / mounted files.
pas.transfer.enabled=${PAS_TRANSFER_ENABLED:true}
pas.transfer.connect-timeout=30s
pas.transfer.auth-timeout=30s
pas.transfer.retry.max-attempts=${PAS_TRANSFER_MAX_ATTEMPTS:4}
pas.transfer.retry.initial-backoff=${PAS_TRANSFER_INITIAL_BACKOFF:30s}
pas.transfer.retry.multiplier=2
pas.transfer.retry.max-backoff=5m
pas.transfer.destinations.claims.host=${PAS_CLAIMS_SFTP_HOST:}
pas.transfer.destinations.claims.port=${PAS_CLAIMS_SFTP_PORT:22}
pas.transfer.destinations.claims.username=${PAS_CLAIMS_SFTP_USERNAME:}
pas.transfer.destinations.claims.private-key-file=${PAS_CLAIMS_SFTP_PRIVATE_KEY_FILE:}
pas.transfer.destinations.claims.private-key-passphrase=${PAS_CLAIMS_SFTP_PRIVATE_KEY_PASSPHRASE:}
pas.transfer.destinations.claims.known-hosts-file=${PAS_SFTP_KNOWN_HOSTS_FILE:}
pas.transfer.destinations.claims.remote-directory=${PAS_CLAIMS_SFTP_REMOTE_DIR:/claims/import}
pas.transfer.destinations.actuarial.host=${PAS_ACTUARIAL_SFTP_HOST:}
pas.transfer.destinations.actuarial.port=${PAS_ACTUARIAL_SFTP_PORT:22}
pas.transfer.destinations.actuarial.username=${PAS_ACTUARIAL_SFTP_USERNAME:}
pas.transfer.destinations.actuarial.private-key-file=${PAS_ACTUARIAL_SFTP_PRIVATE_KEY_FILE:}
pas.transfer.destinations.actuarial.private-key-passphrase=${PAS_ACTUARIAL_SFTP_PRIVATE_KEY_PASSPHRASE:}
pas.transfer.destinations.actuarial.known-hosts-file=${PAS_SFTP_KNOWN_HOSTS_FILE:}
pas.transfer.destinations.actuarial.remote-directory=${PAS_ACTUARIAL_SFTP_REMOTE_DIR:/actuarial/data}

# Replaces CA-7 PAS0100 (daily 23:00) and PAS0200 (1st of month 02:00), America/New_York.
pas.schedule.enabled=${PAS_SCHEDULE_ENABLED:false}
pas.schedule.zone=America/New_York
pas.schedule.daily-extract-cron=${PAS_DAILY_EXTRACT_CRON:0 0 23 * * *}
pas.schedule.monthly-exposure-cron=${PAS_MONTHLY_EXPOSURE_CRON:0 0 2 1 * *}

info.service=pas-batch
info.wave=ab-519-1

# AB-529 DB2 -> PAS migration, delta sync, reconciliation, parallel run. See
# docs/modernization/data-migration.md and parallel-run.md. Off by default.
pas.migration.enabled=${PAS_MIGRATION_ENABLED:false}
# /actuator/migration is not exposed by default (no auth on pas-batch); add "migration" to
# management.endpoints.web.exposure.include only behind the internal network policy.
pas.migration.source.url=${PAS_MIGRATION_SOURCE_URL:}
pas.migration.source.username=${PAS_MIGRATION_SOURCE_USERNAME:}
pas.migration.source.password=${PAS_MIGRATION_SOURCE_PASSWORD:}
pas.migration.source.schema=${PAS_MIGRATION_SOURCE_SCHEMA:ACMEINS}
pas.migration.chunk-size=${PAS_MIGRATION_CHUNK_SIZE:500}
pas.migration.report-dir=${PAS_MIGRATION_REPORT_DIR:/var/lib/pas-batch/migration}
pas.migration.legacy-output-dir=${PAS_MIGRATION_LEGACY_OUTPUT_DIR:/var/lib/pas-batch/legacy-outputs}
pas.migration.triage-register=${PAS_MIGRATION_TRIAGE_REGISTER:parity/parallel-run/triage-register.json}
pas.migration.quirk-register=${PAS_MIGRATION_QUIRK_REGISTER:docs/modernization/quirk-register.md}
pas.migration.schedule.enabled=${PAS_MIGRATION_SCHEDULE_ENABLED:false}
pas.migration.schedule.delta-cron=${PAS_MIGRATION_DELTA_CRON:0 */15 * * * *}
pas.migration.schedule.reconcile-cron=${PAS_MIGRATION_RECONCILE_CRON:0 0 5 * * *}
pas.migration.schedule.parallel-run-cron=${PAS_MIGRATION_PARALLEL_RUN_CRON:0 0 6 * * *}
# Same keys as pas-policy-service: holder PII is encrypted on the way into pas.policy_holders.
pas.pii.encryption-key=${PAS_PII_ENCRYPTION_KEY:}
pas.pii.blind-index-key=${PAS_PII_BLIND_INDEX_KEY:}
pas.pii.key-id=${PAS_PII_KEY_ID:k1}
