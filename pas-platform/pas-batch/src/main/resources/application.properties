spring.application.name=pas-batch
server.port=8081

# Datasource (same env vars across PAS platform services)
spring.datasource.url=${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
spring.datasource.username=${PAS_DB_USERNAME:pas}
spring.datasource.password=${PAS_DB_PASSWORD:}

# Flyway owns Spring Batch metadata in its own schema
spring.flyway.enabled=true
spring.flyway.schemas=pas_batch
spring.flyway.default-schema=pas_batch
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration/batch

# Rating factor set for pas-rating (AB-522): PARITY reproduces PREMBAT (factors 1.0000).
# FILED = real territory/class factors; off by default, business decision (OQ-04).
pas.rating.factor-set=${PAS_RATING_FACTOR_SET:PARITY}

# More connections than premium partitions (each partition holds one while it writes)
spring.datasource.hikari.maximum-pool-size=${PAS_BATCH_DB_POOL_SIZE:20}

# premiumRecalculationJob (AB-523, replaces PREMIUM-BATCH / CA-7 PAS0050 daily 01:00 EST).
# Schedule stays off ("-") until cut-over switches PAS0050 off; then e.g. "0 0 1 * * *".
pas.batch.premium.cron=${PAS_BATCH_PREMIUM_CRON:-}
pas.batch.premium.zone=${PAS_BATCH_PREMIUM_ZONE:America/New_York}
pas.batch.premium.partitions=${PAS_BATCH_PREMIUM_PARTITIONS:8}
pas.batch.premium.chunk-size=${PAS_BATCH_PREMIUM_CHUNK_SIZE:1000}
pas.batch.premium.skip-limit=${PAS_BATCH_PREMIUM_SKIP_LIMIT:10000}
pas.batch.premium.report-dir=${PAS_BATCH_REPORT_DIR:./reports/premium}

# OIDC resource server (ADR 0001 D5). Operator API needs scope batch:operate; it rejects every
# request while the issuer is unset.
pas.security.oidc.issuer-uri=${PAS_OIDC_ISSUER_URI:}
pas.security.oidc.audience=${PAS_OIDC_AUDIENCE:}

# Jobs are launched explicitly, not on startup; metadata schema comes from Flyway
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.table-prefix=pas_batch.BATCH_

# Actuator: minimal exposure, k8s probes, prometheus scrape
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

info.service=pas-batch
info.wave=ab-519-1
