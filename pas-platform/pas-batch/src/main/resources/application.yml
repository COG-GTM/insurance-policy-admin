spring:
  application:
    name: pas-batch
  datasource:
    url: ${PAS_DB_URL:jdbc:postgresql://localhost:5432/pas}
    username: ${PAS_DB_USERNAME}
    password: ${PAS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PAS_DB_POOL_SIZE:16}
  kafka:
    bootstrap-servers: ${PAS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    schemas: pas_batch
    default-schema: pas_batch
    locations: classpath:db/migration/batch
  batch:
    jdbc:
      initialize-schema: never
      table-prefix: pas_batch.BATCH_
    job:
      enabled: false
  main:
    banner-mode: "off"

pas:
  pii:
    encryption:
      active-key-id: ${PAS_PII_ENCRYPTION_KEY_ID:}
      active-key-version: ${PAS_PII_ENCRYPTION_KEY_VERSION:1}
      active-key: ${PAS_PII_ENCRYPTION_KEY:}
    blind-index:
      key: ${PAS_PII_BLIND_INDEX_KEY:}
  migration:
    enabled: ${PAS_MIGRATION_ENABLED:false}
    source:
      url: ${PAS_MIGRATION_SOURCE_URL:}
      username: ${PAS_MIGRATION_SOURCE_USERNAME:}
      password: ${PAS_MIGRATION_SOURCE_PASSWORD:}
      schema: ${PAS_MIGRATION_SOURCE_SCHEMA:ACMEINS}
      ssl: ${PAS_MIGRATION_SOURCE_SSL:true}
      ssl-trust-store-location: ${PAS_MIGRATION_SOURCE_SSL_TRUST_STORE_LOCATION:}
      zone: ${PAS_MIGRATION_SOURCE_ZONE:America/New_York}
      fetch-size: ${PAS_MIGRATION_SOURCE_FETCH_SIZE:500}
    bulk:
      grid-size: ${PAS_MIGRATION_BULK_GRID_SIZE:8}
      chunk-size: ${PAS_MIGRATION_BULK_CHUNK_SIZE:500}
    delta-sync:
      overlap: ${PAS_MIGRATION_DELTA_SYNC_OVERLAP:5m}
      paused: ${PAS_MIGRATION_DELTA_SYNC_PAUSED:false}
      lag-alert-threshold: ${PAS_MIGRATION_DELTA_SYNC_LAG_ALERT_THRESHOLD:15m}
      scheduler-enabled: ${PAS_MIGRATION_DELTA_SYNC_SCHEDULER_ENABLED:false}
      fixed-delay: ${PAS_MIGRATION_DELTA_SYNC_FIXED_DELAY:1m}
    reverse-sync:
      enabled: ${PAS_MIGRATION_REVERSE_SYNC_ENABLED:false}
      max-passes: ${PAS_MIGRATION_REVERSE_SYNC_MAX_PASSES:100}
      username: ${PAS_MIGRATION_REVERSE_USERNAME:}
      password: ${PAS_MIGRATION_REVERSE_PASSWORD:}
    recon:
      scheduler-enabled: ${PAS_MIGRATION_RECON_SCHEDULER_ENABLED:false}
      schedule: ${PAS_MIGRATION_RECON_SCHEDULE:0 0 3 * * *}
      report-dir: ${PAS_MIGRATION_RECON_REPORT_DIR:/var/lib/pas-batch/reports/recon}
      fingerprint-key: ${PAS_RECON_FINGERPRINT_KEY:}
    parallel-run:
      legacy-extract-dir: ${PAS_MIGRATION_PARALLEL_RUN_LEGACY_EXTRACT_DIR:/var/lib/pas-batch/legacy-extracts}
      extract-work-dir: ${PAS_BATCH_EXTRACT_WORK_DIR:/var/lib/pas-batch/extracts}
  rating:
    factor-mode: ${PAS_RATING_FACTOR_MODE:legacy}
  batch:
    premium:
      zone: ${PAS_BATCH_PREMIUM_ZONE:America/New_York}
      grid-size: ${PAS_BATCH_PREMIUM_GRID_SIZE:8}
      chunk-size: ${PAS_BATCH_PREMIUM_CHUNK_SIZE:500}
      concurrency: ${PAS_BATCH_PREMIUM_CONCURRENCY:${PAS_BATCH_PREMIUM_GRID_SIZE:8}}
      skip-limit: ${PAS_BATCH_PREMIUM_SKIP_LIMIT:1000}
      report-dir: ${PAS_BATCH_PREMIUM_REPORT_DIR:/var/lib/pas-batch/reports}
      schedule: ${PAS_BATCH_PREMIUM_SCHEDULE:0 0 1 * * *}
      scheduler-enabled: ${PAS_BATCH_PREMIUM_SCHEDULER_ENABLED:false}
    extract:
      zone: ${PAS_BATCH_EXTRACT_ZONE:America/New_York}
      work-dir: ${PAS_BATCH_EXTRACT_WORK_DIR:/var/lib/pas-batch/extracts}
      schedule:
        enabled: ${PAS_BATCH_EXTRACT_SCHEDULE_ENABLED:false}
        daily-cron: ${PAS_BATCH_EXTRACT_DAILY_CRON:0 0 23 * * *}
        monthly-cron: ${PAS_BATCH_EXTRACT_MONTHLY_CRON:0 0 2 1 * *}
      retry:
        max-attempts: ${PAS_BATCH_EXTRACT_RETRY_MAX_ATTEMPTS:3}
        initial-backoff: ${PAS_BATCH_EXTRACT_RETRY_INITIAL_BACKOFF:5s}
        multiplier: ${PAS_BATCH_EXTRACT_RETRY_MULTIPLIER:2}
        max-backoff: ${PAS_BATCH_EXTRACT_RETRY_MAX_BACKOFF:60s}
    sftp:
      targets:
        claims:
          host: ${PAS_SFTP_CLAIMS_HOST:}
          port: ${PAS_SFTP_CLAIMS_PORT:22}
          username: ${PAS_SFTP_CLAIMS_USER:}
          private-key-file: ${PAS_SFTP_CLAIMS_PRIVATE_KEY_FILE:}
          key-passphrase-file: ${PAS_SFTP_CLAIMS_KEY_PASSPHRASE_FILE:}
          known-hosts-file: ${PAS_SFTP_CLAIMS_KNOWN_HOSTS_FILE:}
          remote-dir: /claims/import
          connect-timeout: 30s
        actuarial:
          host: ${PAS_SFTP_ACTUARIAL_HOST:}
          port: ${PAS_SFTP_ACTUARIAL_PORT:22}
          username: ${PAS_SFTP_ACTUARIAL_USER:}
          private-key-file: ${PAS_SFTP_ACTUARIAL_PRIVATE_KEY_FILE:}
          key-passphrase-file: ${PAS_SFTP_ACTUARIAL_KEY_PASSPHRASE_FILE:}
          known-hosts-file: ${PAS_SFTP_ACTUARIAL_KNOWN_HOSTS_FILE:}
          remote-dir: /actuarial/data
          connect-timeout: 30s
  routing:
    premium-batch: ${PAS_ROUTING_PREMIUM_BATCH:legacy}
    daily-extract: ${PAS_ROUTING_DAILY_EXTRACT:legacy}
    monthly-exposure: ${PAS_ROUTING_MONTHLY_EXPOSURE:legacy}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
    prometheus:
      access: unrestricted
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
    json:
      customizer:
        - com.acme.insurance.pas.pii.logging.PiiMaskingJsonCustomizer
