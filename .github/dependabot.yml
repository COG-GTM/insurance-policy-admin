version: 2
updates:
  - package-ecosystem: maven
    directory: /pas-platform
    schedule:
      interval: weekly
      day: monday
    groups:
      spring-boot:
        patterns:
          - org.springframework.boot*
      testcontainers:
        patterns:
          - org.testcontainers*
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
