name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit/integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify -Dspotless.check.skip=true -Dspotbugs.skip=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pas-test-reports
          path: |
            pas/**/target/surefire-reports/**
            pas/**/target/failsafe-reports/**
          if-no-files-found: ignore

  static-analysis:
    name: Static analysis (Spotless, SpotBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests verify

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Maven dependencies
        uses: google/osv-scanner-action/osv-scanner-action@90b209d0ea55cea1da9fc0c4e65782cc6acb6e2e # v2.2.2
        with:
          scan-args: --recursive ./pas

  container-image:
    name: Container image build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./pas
          file: ./pas/pas-policy-service/Dockerfile
          push: false
          load: true
          tags: pas-policy-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack and check readiness
        run: |
          docker compose up --no-build --wait --wait-timeout 60
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8081/actuator/health/readiness; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Policy service did not become ready" >&2
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
