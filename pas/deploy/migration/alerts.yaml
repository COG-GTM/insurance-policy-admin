# AB-529 alert rules (Prometheus format) for the migration jobs. A run that finds differences
# (exit 10) or fails (exit 5) fails its Kubernetes Job and logs pas.migration.alert with the counts
# (never row values); BatchExitCodeGenerator maps the exit status to the process exit code.
groups:
  - name: pas-migration
    rules:
      - alert: PasReconciliationFailed
        expr: max by (job_name) (kube_job_status_condition{namespace="pas", job_name=~"pas-migration-reconciliation-.*", condition="Failed", status="true"}) == 1
        labels: {severity: page, team: pas}
        annotations:
          summary: "{{ $labels.job_name }}: DB2 and PostgreSQL differ or the reconciliation failed"
          runbook: docs/pas/data-migration.md#daily-reconciliation
      - alert: PasReconciliationMissing
        expr: time() - kube_cronjob_status_last_successful_time{namespace="pas", cronjob="pas-migration-reconciliation"} > 26 * 3600
        for: 30m
        labels: {severity: page, team: pas}
        annotations:
          summary: "No clean DB2/PostgreSQL reconciliation in the last 26 hours"
          runbook: docs/pas/data-migration.md#daily-reconciliation
      - alert: PasDeltaSyncFailing
        # The three newest 15-minute runs all failed or found differences: PostgreSQL is falling
        # behind DB2. The CronJob keeps three runs of each outcome (successful/failedJobsHistoryLimit),
        # so the three newest jobs are always retained and a success between failures resets it.
        # A run still active counts as not failed. One run with differences caused by DB2 changes
        # committed during that run is repaired by the next run and does not page.
        expr: >-
          count by (namespace) (
            topk by (namespace) (3, kube_job_created{namespace="pas", job_name=~"pas-migration-delta-sync-.*"})
            and on (namespace, job_name)
            (kube_job_status_condition{namespace="pas", job_name=~"pas-migration-delta-sync-.*", condition="Failed", status="true"} == 1)
          ) >= 3
        labels: {severity: page, team: pas}
        annotations:
          summary: "DB2 to PostgreSQL delta sync failing"
          runbook: docs/pas/data-migration.md#ongoing-change-sync
