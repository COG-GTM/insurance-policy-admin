# Local development environment for the PAS target platform (ADR 0001 D3, D4).
# Start everything with `make pas-up` (builds the jars, creates .env, starts the stack).
# Credentials come from the git-ignored .env file that `make pas-env` generates; see .env.example.
name: pas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pas
      POSTGRES_USER: ${PAS_DB_USERNAME:?run make pas-env}
      POSTGRES_PASSWORD: ${PAS_DB_PASSWORD:?run make pas-env}
    ports:
      - "127.0.0.1:${PAS_DB_PORT:-5432}:5432"
    volumes:
      - pas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d pas"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${PAS_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${PAS_KAFKA_PORT:-29092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  pas-policy-service:
    build:
      context: pas
      dockerfile: Dockerfile
      args:
        APP: pas-policy-service
    image: pas-policy-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PAS_DB_URL: jdbc:postgresql://postgres:5432/pas
      PAS_DB_USERNAME: ${PAS_DB_USERNAME}
      PAS_DB_PASSWORD: ${PAS_DB_PASSWORD}
      PAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAS_TRACING_SAMPLING_PROBABILITY: "1.0"
      # Local token issuer (pas/scripts/local-token.sh); shared environments set the IdP's JWK set URI.
      PAS_JWT_ISSUER: ${PAS_JWT_ISSUER:-https://pas-local.invalid/issuer}
      PAS_JWT_AUDIENCE: ${PAS_JWT_AUDIENCE:-pas-policy-service}
      PAS_JWT_PUBLIC_KEY_LOCATION: file:/run/pas-jwt/public.pem
    volumes:
      - ./pas/.local-jwt/public.pem:/run/pas-jwt/public.pem:ro
    ports:
      - "127.0.0.1:${PAS_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${PAS_MANAGEMENT_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20

  # One-shot batch run: `docker compose --profile batch run --rm pas-batch` (PAS_BATCH_JOB selects the job).
  pas-batch:
    profiles: ["batch"]
    build:
      context: pas
      dockerfile: Dockerfile
      args:
        APP: pas-batch
    image: pas-batch:local
    depends_on:
      pas-policy-service:
        condition: service_healthy
    environment:
      PAS_DB_URL: jdbc:postgresql://postgres:5432/pas
      PAS_DB_USERNAME: ${PAS_DB_USERNAME}
      PAS_DB_PASSWORD: ${PAS_DB_PASSWORD}
      PAS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAS_BATCH_JOB: ${PAS_BATCH_JOB:-}

volumes:
  pas-postgres:
