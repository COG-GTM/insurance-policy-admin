# PAS Underwriting Service (UNDWRT / PUWR port)
# DB2 v12 for z/OS via the IBM JCC type 4 driver. Credentials come from the environment only.
server.port=${PORT:8080}
spring.application.name=pas-underwriting-service

spring.datasource.url=${PAS_DB_URL:jdbc:db2://mainframe.acme.local:5023/DBPD:currentSchema=ACMEINS;}
spring.datasource.username=${PAS_DB_USERNAME:}
spring.datasource.password=${PAS_DB_PASSWORD:}
spring.datasource.driver-class-name=${PAS_DB_DRIVER:com.ibm.db2.jcc.DB2Driver}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1 FROM SYSIBM.SYSDUMMY1
spring.sql.init.mode=never

pas.underwriting.zone=America/New_York
logging.level.com.acme.insurance.pas=INFO
