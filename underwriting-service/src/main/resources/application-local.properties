# Local profile: H2 in DB2 mode, schema built from sql/ddl/create-tables.sql, sample data.
# Activate with: --spring.profiles.active=local
spring.datasource.url=jdbc:h2:mem:pasuw;MODE=DB2;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS ACMEINS\\;SET SCHEMA ACMEINS
spring.datasource.username=sa
spring.datasource.password=${PAS_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-test-query=SELECT 1
pas.underwriting.h2.init-legacy-ddl=true
pas.underwriting.h2.seed-script=h2/local-seed.sql
logging.level.com.acme.insurance.pas=DEBUG
